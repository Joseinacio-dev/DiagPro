{% load static %}
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova senha — DiagPro</title><link rel="stylesheet" href="{% static 'core/password_reset.css' %}">
<script defer src="{% static 'core/password_reset.js' %}"></script></head>
<body><main><h1>Nova senha <span>DiagPro</span></h1>
<p>Use uma senha exclusiva, com pelo menos 8 caracteres, que não seja comum, somente numérica ou semelhante aos seus dados.</p>
<form id="reset"><label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
<label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" autocomplete="new-password" maxlength="256" required>
<label><input id="show" type="checkbox"> Mostrar senha</label><p id="strength" aria-live="polite"></p>
<button id="generate" type="button">Gerar senha segura</button><button id="copy" type="button">Copiar senha</button>
<button id="submit" type="submit">Salvar nova senha</button></form>
<p id="message" role="status" aria-live="polite"></p></main></body></html>
